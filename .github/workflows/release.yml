# タグ v* を打つと Windows 用 exe をビルドして Releases に置く。
# タグは internal/version の Number と一致していなければならない（v0.11A なら Number は 0.11A）。
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: タグと Number の一致を確かめる
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG
          $number = (Select-String -Path internal/version/version.go -Pattern 'const Number = "([^"]+)"').Matches[0].Groups[1].Value
          "tag=$tag number=$number"
          if ($tag -ne "v$number") { Write-Error "タグ $tag と version.Number $number が一致しない"; exit 1 }

      - name: 検査とテスト
        run: |
          go vet ./...
          go test ./...

      - name: VERSIONINFO のリソースを作る
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0
          go generate ./cmd/github-ppoi

      - name: ビルド
        run: |
          go build -trimpath -ldflags "-s -w" -o github-ppoi.exe ./cmd/github-ppoi
          go build -trimpath -ldflags "-s -w" -o smbtest.exe ./cmd/smbtest

      - name: バージョンの確認
        run: |
          $v = (Get-Item .\github-ppoi.exe).VersionInfo
          "FileVersion=$($v.FileVersion) ProductVersion=$($v.ProductVersion)"
          if (-not $v.FileVersion) { Write-Error "VERSIONINFO が入っていない"; exit 1 }

      - name: Releases に置く
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            github-ppoi.exe
            smbtest.exe
